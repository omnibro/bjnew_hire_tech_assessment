name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; individual jobs raise it only where needed.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Trivy image gate. "0" = report only (stays green, finding is recorded).
  # "1" = enforce: fail the build on fixable HIGH/CRITICAL findings.
  TRIVY_EXIT_CODE: "0"

jobs:
  # ---------------------------------------------------------------- 1. FORMAT
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/BuildInfo.Api.Tests

      # Enforces the rules in .editorconfig. Fails if any file would be reformatted.
      # To fix locally: run `dotnet format src/BuildInfo.Api` and `dotnet format tests/BuildInfo.Api.Tests`.
      - name: Verify formatting (API)
        run: dotnet format src/BuildInfo.Api --verify-no-changes --no-restore

      - name: Verify formatting (tests)
        run: dotnet format tests/BuildInfo.Api.Tests --verify-no-changes --no-restore

  # ------------------------------------------------------------ 2. BUILD/TEST
  build-test:
    name: Build and test
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/BuildInfo.Api.Tests

      - name: Build
        run: dotnet build tests/BuildInfo.Api.Tests -c Release --no-restore

      - name: Test
        run: dotnet test tests/BuildInfo.Api.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/results.trx"

  # ------------------------------------------------- 3. DEPENDENCY SCAN (REPORT)
  dependency-scan:
    name: Dependency scan (report)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/BuildInfo.Api

      # Report only: `dotnet list package --vulnerable` always exits 0.
      # It checks the NuGet audit data for direct and transitive packages.
      - name: List vulnerable NuGet packages
        run: |
          dotnet list src/BuildInfo.Api package --vulnerable --include-transitive 2>&1 | tee dependency-report.txt
          {
            echo '### NuGet dependency scan'
            echo '```'
            cat dependency-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.txt

  # ------------------------------------- 4 + 5. DOCKER BUILD, IMAGE GATE, PUSH
  image:
    name: Build, scan and publish image
    needs: dependency-scan
    runs-on: ubuntu-latest
    # Handed to the deploy job so it releases exactly what was built and pushed here.
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    permissions:
      contents: read
      packages: write          # push to GHCR
      security-events: write   # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image name; repository owners can contain capitals.
      - name: Compute image name and build metadata
        id: meta
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: run the real image and hit the real endpoints.
      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8080:8080 "${IMAGE}:${GITHUB_SHA}"
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/readyz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/version | tee /dev/stderr | grep -q "${GITHUB_SHA}"
          docker rm -f smoke

      # Pin to a released version (ideally a full commit SHA). Check the action's releases page for the latest.
      - name: Trivy report (human-readable, never fails)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Add Trivy report to job summary
        if: always()
        run: |
          {
            echo '### Trivy image scan'
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy SARIF (for the Security tab)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      # Code scanning upload needs a public repo or GitHub Advanced Security.
      # Delete this step (and the SARIF step above) if your repo is private without GHAS.
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.txt
            trivy-results.sarif

      # THE GATE. Exit code comes from TRIVY_EXIT_CODE at the top of this file.
      - name: Trivy gate (HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ env.TRIVY_EXIT_CODE }}

      # Only runs if every step above passed, and only for pushes to main.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  # ----------------------------------------------------------------- 6. DEPLOY
  deploy:
    name: Deploy (staging)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Shows up under the repo's Deployments with history. Add approval rules in
    # Settings -> Environments if you want a manual gate.
    environment:
      name: staging
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      TAG: ${{ needs.image.outputs.tag }}
      CONTAINER_NAME: buildinfo-staging
      HOST_PORT: "8080"
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull by the exact tag that was just pushed, never "latest".
      - name: Pull the image that was just pushed
        run: docker pull "${IMAGE}:${TAG}"

      # Idempotent: safe whether or not a previous release is running.
      - name: Stop and remove any existing container
        run: |
          if [ -n "$(docker ps -aq --filter "name=^${CONTAINER_NAME}$")" ]; then
            docker stop "${CONTAINER_NAME}"
            docker rm "${CONTAINER_NAME}"
          else
            echo "No existing container named ${CONTAINER_NAME}"
          fi

      - name: Run the new container
        run: |
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p "${HOST_PORT}:8080" \
            -e APP_VERSION="${TAG}" \
            "${IMAGE}:${TAG}"

      - name: Wait for readiness
        run: |
          for i in $(seq 1 20); do
            curl -fsS "http://localhost:${HOST_PORT}/readyz" && exit 0
            sleep 1
          done
          echo "::error::Service did not become ready"
          exit 1

      # Confirm the running container reports the tag we just built.
      - name: Verify deployed version matches the tag
        run: |
          body=$(curl -fsS "http://localhost:${HOST_PORT}/version")
          echo "${body}"
          deployed=$(echo "${body}" | jq -r '.appVersion')
          if [ "${deployed}" != "${TAG}" ]; then
            echo "::error::Version mismatch: running '${deployed}', expected '${TAG}'"
            exit 1
          fi
          echo "Deployed version ${deployed} matches the built tag."
          {
            echo '### Deployed to staging'
            echo "- Image: \`${IMAGE}:${TAG}\`"
            echo "- Container: \`${CONTAINER_NAME}\` on port ${HOST_PORT}"
            echo "- /version reports appVersion = tag"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs
        if: always()
        run: docker logs "${CONTAINER_NAME}"
